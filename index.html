<link rel="manifest" href="data:application/manifest+json,{"name":"Feeding%20Log","short_name":"Feeding%20Log","start_url":"./","display":"standalone","background_color":"%23F7F7FA","theme_color":"%23F7F7FA"}">

<style>
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #F7F7FA;
    overscroll-behavior-y: none;
    -webkit-text-size-adjust: 100%;
  }
  * { -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100%; }
</style>

<script>
(function () {
  try {
    var saved = JSON.parse(localStorage.getItem("feedlog-v1") || "{}");
    var pref = saved.theme || "auto";
    var dark = pref === "dark" ||
      (pref === "auto" && window.matchMedia &&
       window.matchMedia("(prefers-color-scheme: dark)").matches);
    var bg = dark ? "#141115" : "#F7F7FA";
    document.documentElement.style.background = bg;
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", bg);
  } catch (e) {}
})();
</script>
<script>
/* Guard rail. The app was once shipped calling an API that only exists in a
   different runtime, so every save failed silently and the log lived only in
   memory. If storage is not genuinely writable, say so loudly instead. */
(function () {
  var ok = false;
  try {
    localStorage.setItem("__probe__", "1");
    ok = localStorage.getItem("__probe__") === "1";
    localStorage.removeItem("__probe__");
  } catch (e) { ok = false; }
  if (!ok) {
    document.addEventListener("DOMContentLoaded", function () {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;background:#E04B3C;color:#fff;" +
        "font:600 14px -apple-system,system-ui,sans-serif;padding:14px 16px;text-align:center";
      d.textContent = "Storage is not available, so nothing you log will be saved.";
      document.body.appendChild(d);
    });
  }
})();
</script>

<script>
(function () {
  if (!("serviceWorker" in navigator)) return;

  var hadController = !!navigator.serviceWorker.controller;
  var reloaded = false;

  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });

  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      reg.update();
      /* A waiting worker means a newer build is sitting there. Take it now
         rather than making the user launch twice. */
      if (reg.waiting) reg.waiting.postMessage("skip-waiting");
      reg.addEventListener("updatefound", function () {
        var sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", function () {
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            sw.postMessage("skip-waiting");
          }
        });
      });

      /* Check again whenever the app comes back to the foreground. */
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) reg.update();
      });
    }).catch(function () {});
  });

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
})();
</script>
